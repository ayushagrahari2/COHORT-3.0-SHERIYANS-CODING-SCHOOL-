    <!-- Making registration -->

    <h1> Student registration form: </h1> <br>

    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <br>
            <label for="name">Name</label>
            <br>    
            <input id="name" type="text" placeholder="Name"> <br><br>

            <label for="email">Email</label>
            <br>    
            <input id="email" type="text" placeholder="Email"> <br><br>

            <label for="mobile">Mobile</label>
            <br>    
            <input id="mobile" type="text" placeholder="Mobile"> <br><br>
        </fieldset>

        <br> <br>

        <fieldset>
            <legend> Address Details </legend>
            <label for="addressline1">Address line 1</label><br>
            <textarea  id="addressline1" rows="3"></textarea>

            <br><br>

            <label for="city">City</label><br>
            <select id="city">
                <option>Bhopal</option>
                <option>Bengluru</option>
                <option>Mumbai</option>
                <option>bihar</option>
            </select>

            <br><br>
            <label for="country">Country</label>
            <select id="country">
                <option>India</option>
                <option>Australia</option>
                <option>New Zeland</option>
                <option>Russia</option>
            </select>

        </fieldset>

        <br><br>

        <label for="courses">Select courses</label>
        <select id="courses">
            <optgroup label="Frontend">
                <option>html</option>
                <option>css</option>
                <option>js</option>
            </optgroup>
            <optgroup label="Backend">
                <option>Node js </option>
                <option>Express js </option>
            </optgroup>
        </select>

        <br><br>

        <button>Submit form</button>

        <h1 contenteditable="true">Ayush</h1>
        <h1 draggable="true">Ayush</h1>
    </form>

</body>
